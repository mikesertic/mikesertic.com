<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Cormorant Garamond'; font-weight: 300 700; src: url('../fonts/cormorant-garamond.woff2') format('woff2'); }
  @font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 300 700; src: url('../fonts/cormorant-garamond-italic.woff2') format('woff2'); }
  @font-face { font-family: 'Libre Franklin'; font-weight: 100 900; src: url('../fonts/libre-franklin.woff2') format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #fafaf8; font-family: 'Libre Franklin', sans-serif; color: #1a1a1a; position: relative; }
  .rule { position: absolute; left: 80px; right: 80px; top: 72px; height: 1px; background: #d4d0c8; }
  .rule::after { content: ''; position: absolute; left: 0; top: 50%; width: 9px; height: 9px; background: #b8953e; transform: translate(0,-50%) rotate(45deg); }
  .diamond { position: absolute; right: -120px; top: 50%; width: 420px; height: 420px; border: 1px solid rgba(184,149,62,0.22); transform: translateY(-50%) rotate(45deg); }
  .text { position: absolute; left: 80px; top: 120px; width: 660px; }
  .eyebrow { font-size: 18px; letter-spacing: 0.14em; text-transform: uppercase; color: #85692a; font-weight: 500; margin-bottom: 26px; }
  .name { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 88px; line-height: 1; letter-spacing: -0.02em; margin-bottom: 22px; }
  .line { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; font-size: 40px; line-height: 1.2; color: #4a4a4a; }
  .url { position: absolute; left: 80px; bottom: 64px; font-size: 20px; letter-spacing: 0.06em; color: #6a6a6a; }
  .photo { position: absolute; right: 80px; top: 110px; width: 330px; height: 440px; object-fit: cover; object-position: top center; }
</style>
</head>
<body>
  <div class="rule"></div>
  <div class="diamond"></div>
  <div class="text">
    <div class="eyebrow" id="eyebrow">President, Advocates for Self-Government</div>
    <div class="name">Mike Sertic</div>
    <div class="line" id="line">Self-government as a practice, not just a principle.</div>
  </div>
  <div class="url">mikesertic.com</div>
  <img class="photo" src="../headshot-bio.jpg" alt="">
</body>
</html>
